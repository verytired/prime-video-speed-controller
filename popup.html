<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>再生速度</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>再生速度</h1>
    </header>

    <div id="rate">1.0x</div>

    <div class="slider-row">
      <button id="dec" class="round" aria-label="遅くする">−</button>
      <input id="slider" type="range" min="0.25" max="4" step="0.05" value="1" />
      <button id="inc" class="round" aria-label="速くする">+</button>
    </div>

    <div class="presets">
      <div class="preset"><button data-speed="1">1.0</button><span class="label">標準</span></div>
      <div class="preset"><button data-speed="1.25">1.25</button></div>
      <div class="preset"><button data-speed="1.5">1.5</button></div>
      <div class="preset"><button data-speed="2">2.0</button></div>
      <div class="preset"><button data-speed="3">3.0</button></div>
    </div>

    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
